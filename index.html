<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: use the whole screen, including behind the notch
       (style.css keeps content inside the safe area). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crossword Duel</title>
  <!-- Added to a phone's home screen, the game opens full screen like an app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f6f4ef">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Crossword">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Start menu: pick language, puzzle size and computer strength, then Play. -->
  <section id="menu" class="menu">
    <div class="menu-card">
      <img class="menu-logo" src="icons/icon-192.png" alt="">
      <h1 data-i18n="title">Crossword Duel</h1>
      <div class="menu-group">
        <h2 data-i18n="language">Language</h2>
        <div class="choices" data-setting="lang"></div>
      </div>
      <div class="menu-group">
        <h2 data-i18n="puzzle">Puzzle</h2>
        <div class="choices" data-setting="level"></div>
      </div>
      <div class="menu-group">
        <h2 data-i18n="opponent">Computer</h2>
        <div class="choices" data-setting="cpu"></div>
      </div>
      <button id="play" class="play-btn" data-i18n="play">Play</button>
      <button id="continue" class="continue-btn" data-i18n="continue" hidden>Continue</button>
      <button id="how-to-menu" class="how-to-btn" data-i18n="howTo">How to play</button>
    </div>
  </section>

  <div id="game" class="game" hidden>
    <section class="scoreboard">
      <div class="counter player">
        <span class="avatar">😎</span>
        <span class="who" data-i18n="you">You</span>
        <b id="score-player" class="digits">0</b>
      </div>
      <div id="turn" class="turn"></div>
      <div class="counter cpu">
        <b id="score-cpu" class="digits">0</b>
        <span class="who" data-i18n="cpu">Computer</span>
        <span class="avatar">🤖</span>
      </div>
    </section>
  
    <main>
      <div class="board">
        <div id="grid" class="grid"></div>
        <div class="rack-area">
          <div class="rack"><div id="hand" class="hand"></div></div>
          <div class="rack-side">
            <button id="end-turn" class="end-turn" data-i18n="endTurn">End turn</button>
            <p id="message" class="message"></p>
            <div class="info-row">
              <span id="bag-count" class="bag-count"></span>
              <span id="cpu-hand" class="cpu-hand"></span>
            </div>
            <button id="menu-btn" class="menu-btn" data-i18n="menu">Menu</button>
            <button id="how-to" class="how-to-btn" data-i18n="howTo">How to play</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- How to play: covers the screen; closes with the ✕, Esc, a tap outside or a swipe down. -->
  <div id="help-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <button id="help-close" class="modal-close" aria-label="Close">✕</button>
      <h2 id="help-title" data-i18n="howTo">How to play</h2>
      <ul id="help-list" class="help-list"></ul>
    </div>
  </div>

  <div id="tally" class="tally" hidden></div>
  <div id="clue-zoom" class="clue-zoom" hidden></div>

  <div id="result" class="result" hidden>
    <div id="confetti" class="confetti"></div>
    <div class="result-card">
      <div id="result-emoji" class="result-emoji"></div>
      <p id="result-text"></p>
      <p id="result-quip" class="result-quip"></p>
      <div id="result-score" class="result-scores"></div>
      <div class="result-buttons">
        <button id="play-again" data-i18n="playAgain">Play again</button>
        <button id="result-menu" class="result-menu-btn" data-i18n="menu">Menu</button>
      </div>
    </div>
  </div>

  <script src="puzzles.js"></script>
  <script src="clues.js"></script>
  <script src="generator.js"></script>
  <script src="game.js"></script>
</body>
</html>
