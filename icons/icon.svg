<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- App icon: two letter tiles on the game's green. Everything important stays in
       the middle so phones can crop it to a circle or rounded square. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf0cf"/>
      <stop offset="1" stop-color="#f3d999"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3bb07a"/>
      <stop offset="1" stop-color="#25875a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="rotate(-10 200 260)">
    <rect x="118" y="168" width="150" height="160" rx="20" fill="#b8924d"/>
    <rect x="118" y="160" width="150" height="160" rx="20" fill="url(#tile)" stroke="#c9a868" stroke-width="3"/>
    <text x="193" y="276" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#3b2a14" text-anchor="middle">A</text>
    <text x="248" y="308" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#3b2a14" text-anchor="middle">1</text>
  </g>
  <g transform="rotate(8 320 270)">
    <rect x="246" y="196" width="150" height="160" rx="20" fill="#b8924d"/>
    <rect x="246" y="188" width="150" height="160" rx="20" fill="url(#tile)" stroke="#c9a868" stroke-width="3"/>
    <text x="321" y="304" font-family="Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#3b2a14" text-anchor="middle">Z</text>
    <text x="376" y="336" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#3b2a14" text-anchor="middle">1</text>
  </g>
</svg>
